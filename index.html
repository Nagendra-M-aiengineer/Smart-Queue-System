<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manipal Hospitals – Smart Queue System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ── helpers ── */
    function parseToken(label) {
      if (typeof label !== "string" || !label.startsWith("#")) return null;
      const n = parseInt(label.slice(1), 10);
      return Number.isNaN(n) ? null : n;
    }

    /* ── tiny UI primitives ── */
    function Card({ className = "", children }) {
      return (
        <div className={`rounded-2xl border bg-white shadow-lg ${className}`}>
          {children}
        </div>
      );
    }

    function Button({ className = "", onClick, children }) {
      return (
        <button
          onClick={onClick}
          className={`inline-flex items-center gap-2 rounded-md px-4 py-2 text-sm font-medium
                      bg-blue-600 text-white hover:bg-blue-700 transition-colors ${className}`}
        >
          {children}
        </button>
      );
    }

    function Progress({ value = 0 }) {
      return (
        <div className="relative h-2 w-full overflow-hidden rounded-full bg-blue-200 mt-2">
          <div
            className="h-full bg-blue-600 transition-all"
            style={{ width: `${Math.min(100, Math.max(0, value))}%` }}
          />
        </div>
      );
    }

    /* ── main app ── */
    function HealthcareApp() {
      const [token]        = useState(23);
      const [ahead, setAhead] = useState(4);
      const avgConsultMins = 7;
      const estimatedWait  = Math.max(0, ahead * avgConsultMins);

      const [currentToken, setCurrentToken] = useState(22);
      const [appointments, setAppointments] = useState([
        { time: "10:00", patient: "#21", doctor: "Dr. Manish Rai", dept: "Cardiology",      priority: "Normal" },
        { time: "10:20", patient: "#22", doctor: "Dr. Manish Rai", dept: "Cardiology",      priority: "Normal" },
        { time: "10:40", patient: "Emergency", doctor: "Triage",   dept: "ER",              priority: "Urgent", emergency: true },
        { time: "11:00", patient: "#23", doctor: "Dr. Manish Rai", dept: "Cardiology",      priority: "Normal" },
      ]);

      const handleNext = () => {
        setAppointments(prev => {
          if (prev.length === 0) return prev;
          const [served, ...rest] = prev;
          const parsed = parseToken(served.patient);
          if (parsed != null) setCurrentToken(parsed);
          else setCurrentToken(t => t + 1);
          setAhead(a => Math.max(0, a - 1));
          return rest;
        });
      };

      return (
        <div className="p-6 grid gap-6 md:grid-cols-2 bg-gradient-to-br from-blue-50 to-white min-h-screen">

          {/* ── Header ── */}
          <div className="md:col-span-2 text-center mb-2">
            <h1 className="text-3xl font-extrabold text-blue-800">
              Manipal Hospitals Smart Queue System
            </h1>
            <p className="text-sm text-gray-500 mt-1">
              Old Airport Road, Bengaluru &bull; NABH Accredited &bull; 700+ Beds &bull; 60+ Specialties
            </p>
          </div>

          {/* ── Patient App ── */}
          <Card className="border-blue-100">
            <div className="p-6">
              <h2 className="text-xl font-bold mb-4 text-blue-700">📱 Patient App</h2>

              {/* Queue Tracker */}
              <div className="p-4 bg-gradient-to-r from-blue-100 to-blue-50 rounded-xl border border-blue-200 mb-4">
                <h3 className="font-semibold mb-1 text-blue-800">🎟️ Queue Tracker</h3>
                <p>Token Number: <b>#{token}</b></p>
                <p>Ahead of You: <b>{ahead} patients</b></p>
                <p>Estimated Wait: <b>{estimatedWait} mins</b></p>
                <Progress value={((5 - Math.min(5, ahead)) / 5) * 100} />
              </div>

              {/* Upcoming Appointment */}
              {appointments.length > 0 && (
                <div className="p-4 bg-white rounded-xl border shadow">
                  <h3 className="font-semibold mb-1">🗓️ Upcoming Appointment</h3>
                  <p>
                    {appointments[0].doctor} ({appointments[0].dept})
                    {appointments[0].priority === "Urgent" && (
                      <span className="text-red-600 font-semibold ml-1">• Urgent</span>
                    )}
                  </p>
                  <p>
                    Date: <b>2025-08-20</b> &bull; Slot: <b>{appointments[0].time}</b> &bull; Token: <b>{appointments[0].patient}</b>
                  </p>
                  <div className="mt-3">
                    <Button className="bg-green-600 hover:bg-green-700" onClick={handleNext}>
                      ✅ Next
                    </Button>
                  </div>
                </div>
              )}

              {appointments.length === 0 && (
                <div className="p-4 bg-green-50 rounded-xl border border-green-200 text-green-700 text-center font-semibold">
                  🎉 All appointments completed!
                </div>
              )}
            </div>
          </Card>

          {/* ── Doctor Dashboard ── */}
          <Card>
            <div className="p-6">
              <h2 className="text-xl font-bold mb-4 text-green-700">💻 Doctor Dashboard</h2>

              {/* Appointments list */}
              <div className="mb-4 p-4 bg-green-50 rounded-xl">
                <h3 className="font-semibold mb-2">📋 Today's Appointments</h3>
                {appointments.length === 0 ? (
                  <p className="text-gray-500 text-sm">No appointments remaining.</p>
                ) : (
                  <ul className="space-y-1 text-sm">
                    {appointments.map((a, idx) => (
                      <li
                        key={idx}
                        className={`flex items-center gap-2 ${
                          a.priority === "Urgent" || a.emergency
                            ? "font-bold text-red-600"
                            : "text-gray-700"
                        }`}
                      >
                        <span className="w-12 shrink-0">{a.time}</span>
                        <span>Patient {a.patient} – {a.doctor} ({a.dept})</span>
                        {a.priority === "Urgent" && (
                          <span className="ml-auto text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">
                            Urgent
                          </span>
                        )}
                      </li>
                    ))}
                  </ul>
                )}
              </div>

              {/* Queue Overview */}
              <div className="p-4 bg-yellow-50 rounded-xl">
                <h3 className="font-semibold mb-2">📊 Queue Overview</h3>
                <p>Current Token: <b>#{currentToken}</b></p>
                <p>Next: <b>#{currentToken + 1}</b></p>
                <p>Waiting Patients: <b>{appointments.length}</b></p>
                <div className="mt-3">
                  <Button onClick={handleNext}>➡️ Next Patient</Button>
                </div>
              </div>
            </div>
          </Card>

        </div>
      );
    }

    /* ── mount ── */
    ReactDOM.createRoot(document.getElementById("root")).render(<HealthcareApp />);
  </script>
</body>
</html>
